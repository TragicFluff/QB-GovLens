[pytest]
testpaths = tests
filterwarnings =
    # CrewAI checks its own deprecated settings internally; GovLens does not use them.
    ignore::DeprecationWarning:crewai(\..*)?
    # CrewAI's checkpoint/replay feature cannot save callbacks; GovLens does not use checkpoints.
    ignore:A function callback cannot be saved in a checkpoint:UserWarning
